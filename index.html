<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="mobile-web-app-capable" content="yes">
<title>Cockpit</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#17211D;background:#F3F4F1;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.55}
input,select,textarea{font-family:inherit;font-size:15px;color:#17211D}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #0E6B57;outline-offset:2px}
h1,h2,h3{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:#55625B}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap;background:#ECEFEA;color:#3E4A44}
.chip.green{background:#E2F1EC;color:#0B5848}
.chip.amber{background:#FFF3C9;color:#7A5A00}
.chip.red{background:#FBE4E4;color:#9B2C2C}
.card{background:#fff;border:1px solid #DDE1DB;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;overflow:hidden;gap:0}
.card h2{font-size:16px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid #C5CCC6;background:#fff;font-size:14px;font-weight:500}
.btn:hover{background:#ECEFEA}
.btn.prime{background:#0E6B57;border-color:#0E6B57;color:#fff}
.btn.prime:hover{background:#0B5848}
.btn.dark{background:#17211D;border-color:#17211D;color:#fff}
.btn.dark:hover{background:#2B3731}
.btn.sm{min-height:36px;padding:6px 14px;border-radius:999px;font-size:13px}
.btn.ok{border-color:#0E6B57;color:#0B5848}
.icon{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon:hover{background:#ECEFEA}
.field{width:100%;border:1px solid #C5CCC6;border-radius:10px;padding:10px 12px;background:#FBFCFA}
textarea.field{resize:none;line-height:1.45}

/* header */
.top{background:#fff;border-bottom:1px solid #DDE1DB;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.top .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rituals{display:flex;flex-wrap:wrap;gap:8px}

/* layout */
.wrap{padding:20px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:20px;align-items:start;grid-template-columns:minmax(0,1fr)}
.col{display:none;flex-direction:column;gap:16px;min-width:0}
.col.active{display:flex}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DDE1DB;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;min-height:52px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:#55625B}
.nav button.on{background:#E2F1EC;color:#0B5848;font-weight:600}
body{padding-bottom:84px}
@media (min-width:900px){
  .nav{display:none}
  body{padding-bottom:0}
  .col{display:flex}
  .grid{grid-template-columns:340px minmax(0,1fr);grid-template-areas:"left center" "right center"}
  .col[data-tab=capture]{grid-area:left}
  .col[data-tab=today]{grid-area:center}
  .col[data-tab=day]{grid-area:right}
}
@media (min-width:1220px){
  .grid{grid-template-columns:360px minmax(0,1fr) 360px;grid-template-areas:"left center right"}
}
@media (max-width:899px){
  .top{padding:12px 16px}
  .wrap{padding:14px 12px}
}

/* today rows */
.trow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #E6E9E4;flex-wrap:wrap}
.trow .tmain{flex:1 1 200px;min-width:0}
.ttitle{font-size:16px;font-weight:500}
.ttitle.done{color:#55625B;text-decoration:line-through}
.tsub{font-size:13px;color:#55625B;margin-top:2px}
.chk{flex:none;width:30px;height:30px;border-radius:999px;border:2px solid #7B8781;background:#fff;padding:0;display:inline-flex;align-items:center;justify-content:center}
.chk.on{background:#0E6B57;border-color:#0E6B57}
.tm{width:104px;border:1px solid #C5CCC6;border-radius:8px;padding:6px 8px;font-size:13px;background:#FBFCFA;min-height:36px}
.empty{padding:16px;color:#55625B;font-size:14px}

/* inbox */
.item{border:1px solid #E6E9E4;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#FBFCFA}

/* timeline */
.tl{position:relative}
.hr{height:44px;border-top:1px solid #E6E9E4;padding-top:3px;font-size:12px;color:#55625B}
.blk{position:absolute;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500;line-height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.now{position:absolute;left:48px;right:0;height:2px;background:#B42318}
.nowtag{position:absolute;right:4px;padding:0 8px;border-radius:999px;background:#B42318;color:#fff;font-size:11px;line-height:18px}

/* week picks */
.pick{width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:52px;border:0;border-top:1px solid #E6E9E4;background:transparent;text-align:left;font-size:15px}
.pick:hover{background:#F3F6F2}
.pick.sel{background:#EEF7F3}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #7B8781;display:inline-flex;align-items:center;justify-content:center}
.pick.sel .box{background:#0E6B57;border-color:#0E6B57}

/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(23,33,29,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.panel{background:#F3F4F1;border-radius:16px;width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px;padding:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#17211D;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
@media (min-width:900px){.toast{bottom:28px}}
.seg{display:inline-flex;border:1px solid #C5CCC6;border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 16px;min-height:40px;font-size:14px;font-weight:500}
.seg button.on{background:#17211D;color:#fff}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.err{color:#9B2C2C;font-size:14px}
.lnk{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lnk:hover{text-decoration:underline}
.veil.edit{z-index:50}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#55625B}
.fl .field{font-size:15px;color:#17211D}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn.on{background:#17211D;border-color:#17211D;color:#fff}
.blk.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px rgba(23,33,29,.12)}
.blk.drag.moving{cursor:grabbing;box-shadow:0 4px 14px rgba(23,33,29,.25);z-index:5}
.rz{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize}
.rz::after{content:"";position:absolute;left:50%;bottom:3px;width:26px;height:3px;margin-left:-13px;border-radius:2px;background:currentColor;opacity:.45}

/* roadmap + review */
.panel.wide{max-width:1180px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.pcard{border:1px solid #E6E9E4;border-radius:12px;padding:8px 12px;background:#FBFCFA;display:flex;flex-direction:column;gap:2px}
.pcard b{font-size:17px}.pcard span{font-size:12.5px;color:#55625B}
.pcard.warn{border-color:#E1B766;background:#FFF9E8}
.rscroll{overflow-x:auto}
.rgrid{min-width:1000px;position:relative}
.rrow{display:grid;grid-template-columns:190px minmax(0,1fr);border-top:1px solid #E6E9E4}
.rrow:first-child{border-top:0}
.rlab{padding:8px 8px 8px 12px;font-size:13px;position:sticky;left:0;background:#fff;z-index:4;border-right:1px solid #E6E9E4}
.rlab small{display:block;color:#55625B;font-size:11.5px;line-height:1.3}
.rmini{border:1px solid #C5CCC6;background:#fff;border-radius:8px;font-size:11.5px;padding:3px 8px}
.rlane{position:relative}
.rtick{position:absolute;top:0;bottom:0;border-left:1px solid #E6E9E4;font-size:11px;color:#55625B;padding:6px 0 0 4px;white-space:nowrap;pointer-events:none}
.rtoday{position:absolute;top:0;bottom:0;width:2px;background:#B42318;z-index:2;pointer-events:none}
.robj{position:absolute;top:12px;height:24px;border-radius:6px;background:#17211D;color:#fff;font-size:12px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{position:absolute;height:22px;border-radius:6px;border:0;color:#fff;font-size:12px;font-weight:500;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;min-width:6px}
.rfill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.28);pointer-events:none}
.rglab{position:absolute;font-size:12px;color:#3E4A44;white-space:nowrap;pointer-events:none;z-index:1}
.rdia{position:absolute;width:14px;height:14px;transform:rotate(45deg);margin-left:-7px;cursor:ew-resize;touch-action:none;z-index:3;border:1px solid #fff}
.rdot{position:absolute;width:15px;height:15px;border-radius:50%;margin-left:-7px;cursor:ew-resize;touch-action:none;border:2px solid #fff;z-index:3}
.rtip{position:fixed;z-index:80;background:#17211D;color:#fff;padding:3px 9px;border-radius:8px;font-size:12px;pointer-events:none}
.pbar{height:10px;border-radius:6px;background:#E6E9E4;overflow:hidden}
.pbar span{display:block;height:100%;background:#0E6B57}
.rtbar{position:absolute;height:20px;border-radius:5px;color:#fff;font-size:11.5px;padding:1px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;z-index:3;border:1px solid rgba(255,255,255,.7)}
.rh{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;touch-action:none}
.rh.l{left:0}.rh.r{right:0}
.rh::after{content:"";position:absolute;top:5px;bottom:5px;left:4px;width:2px;background:rgba(255,255,255,.8);border-radius:1px}
.rarrows{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
.depchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #C5CCC6;border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;background:#fff}
.depchip.bad{border-color:#B42318;background:#FBE4E4}
.depchip button{border:0;background:transparent;font-size:15px;line-height:1;padding:2px 6px}
.cap{height:6px;border-radius:4px;background:#E6E9E4;overflow:hidden}
.cap span{display:block;height:100%;background:#0E6B57}
.cap.over span{background:#B8700F}
.weekwrap{display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.trchip{border:1px dashed #7B8781;background:#fff;border-radius:10px;padding:6px 12px;font-size:13px}
</style>
</head>

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

function gcalUrl(f, o) {

  } else {

function icsEsc(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) {
  var out = [], enc = new TextEncoder(), cur = '', curBytes = 0;
  Array.from(line).forEach(function (ch) {
    var b = enc.encode(ch).length;
    if (curBytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; curBytes = 0; }
    cur += ch; curBytes += b;
  });
  out.push(cur);
  return out.join('\r\n ');
}
function icsStamp(d) { return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z'; }
function buildIcs(tasks) {
  var now = new Date(), stamp = icsStamp(now), seq = Math.floor(now.getTime() / 1000);
  var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cockpit//Daily Cockpit//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-TIMEZONE:Asia/Kolkata',
    'BEGIN:VTIMEZONE', 'TZID:Asia/Kolkata', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0530', 'TZOFFSETTO:+0530', 'TZNAME:IST', 'END:STANDARD', 'END:VTIMEZONE'];
  tasks.forEach(function (t) {
    var d8 = t.today_date.replace(/-/g, ''), st = toMin(t.sched_start), en = Math.min(st + (t.budget_min || 30), 1439);
    var hh = function (m) { return pad(Math.floor(m / 60)) + pad(m % 60) + '00'; };
    L.push('BEGIN:VEVENT', 'UID:' + t.id + '@cockpit', 'DTSTAMP:' + stamp, 'LAST-MODIFIED:' + stamp, 'SEQUENCE:' + seq,
      'DTSTART;TZID=Asia/Kolkata:' + d8 + 'T' + hh(st), 'DTEND;TZID=Asia/Kolkata:' + d8 + 'T' + hh(en),
      'SUMMARY:' + icsEsc(t.title), 'DESCRIPTION:' + icsEsc('Domain: ' + t.domain + (t.notes ? '\n' + t.notes : '')),
      'BEGIN:VALARM', 'TRIGGER:-PT10M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(t.title), 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');

}

function isScheduled(t) { return t.status === 'open' && !!t.today_date && t.today_date >= todayStr(); }

/* ---------- derived ---------- */
function derived() {
  var t0 = todayStr();
  var today = S.tasks.filter(function (t) { return t.today_date === t0 && (t.status === 'open' || t.status === 'done'); });
  today.sort(function (a, b) {
    var ad = a.status === 'done' ? 1 : 0, bd = b.status === 'done' ? 1 : 0;
    if (ad !== bd) return ad - bd;
    var as = a.sched_start ? toMin(a.sched_start) : 9999, bs = b.sched_start ? toMin(b.sched_start) : 9999;
    if (as !== bs) return as - bs;
    return (a.sort_order - b.sort_order) || (a.created_at < b.created_at ? -1 : 1);
  });
  var open = today.filter(function (t) { return t.status === 'open'; });
  var planned = open.reduce(function (n, t) { return n + (t.budget_min || 0); }, 0);
  var soon = S.tasks.filter(function (t) { return t.status === 'open' && t.today_date !== t0 && t.priority !== 'someday'; });
  soon.sort(function (a, b) {
    var ad = a.due_date || '9999', bd = b.due_date || '9999';
    if (ad !== bd) return ad < bd ? -1 : 1;
    return a.created_at < b.created_at ? -1 : 1;
  });
  var waiting = S.tasks.filter(function (t) { return t.status === 'waiting'; });
  return { t0: t0, today: today, open: open, planned: planned, soon: soon, waiting: waiting };
}

      '<span class="chip' + (on ? ' green' : '') + '">' + (on ? 'Done today' : 'Not yet') + '</span></button>';
  }).join('');
  return '<section class="card"><div class="row" style="flex-wrap:wrap;gap:12px"><h2 style="margin-right:6px">Habits</h2>' + btns + '</div></section>';
}

function timelineCard(D) {
  var blocks = [];
  D.open.concat(D.today.filter(function (t) { return t.status === 'done'; })).forEach(function (t) {
    if (!t.sched_start) return;
    var st = toMin(t.sched_start), du = Math.max(t.budget_min || 30, 15);
    blocks.push({ id: t.id, st: st, en: st + du, label: t.title + (t.budget_min ? ' · ' + fmtMin(t.budget_min) : ''), dom: t.domain, done: t.status === 'done' });
  });
  RITUALS.forEach(function (r) {
    var st = toMin(r.at);
    blocks.push({ st: st, en: st + Math.max(r.min, 15), label: r.label + ' · ' + r.min + 'm', ritual: true });
  });
  var startH = 8, endH = 21;
  blocks.forEach(function (b) {
    startH = Math.min(startH, Math.floor(b.st / 60));
    endH = Math.max(endH, Math.ceil(b.en / 60));
  });
  var nm = nowMin();
  startH = Math.min(startH, Math.floor(nm / 60)); endH = Math.max(endH, Math.min(24, Math.ceil(nm / 60)));
  blocks.sort(function (a, b) { return a.st - b.st || a.en - b.en; });
  var colEnds = [];
  blocks.forEach(function (b) {
    var c = 0;
    while (colEnds[c] !== undefined && colEnds[c] > b.st) c++;
    b.col = c; colEnds[c] = Math.max(b.en, b.st + 22 / HOUR_PX * 60);
  });
  var ncols = Math.max(1, colEnds.length);
  var height = (endH - startH) * HOUR_PX;
  var hours = '';
  for (var h = startH; h < endH; h++) { hours += '<div class="hr mono">' + pad(h) + ':00</div>'; }
  var html = blocks.map(function (b) {
    var top = (b.st - startH * 60) / 60 * HOUR_PX;
    var hh = Math.max(22, (b.en - b.st) / 60 * HOUR_PX - 2);
    var w = 'calc((100% - 62px) / ' + ncols + ')';
    var left = 'calc(56px + (100% - 62px) / ' + ncols + ' * ' + b.col + ')';
    var bg, fg;
    if (b.ritual) { bg = '#ECEFEA'; fg = '#3E4A44'; } else { var c = domColors(b.dom); bg = c[0]; fg = c[1]; }
    var attrs = b.id ? ' data-id="' + b.id + '" data-st="' + b.st + '" data-dur="' + (b.en - b.st) + '" data-sh="' + startH + '" role="button" tabindex="0" aria-label="' + esc(b.label) + ', drag to move, or open to edit"' : '';
    return '<div class="blk' + (b.id ? ' drag' : '') + '"' + attrs + ' style="top:' + top + 'px;height:' + hh + 'px;left:' + left + ';width:' + w + ';background:' + bg + ';color:' + fg + (b.done ? ';text-decoration:line-through;opacity:.7' : '') + '">' + esc(b.label) + (b.id && !b.done ? '<span class="rz" aria-hidden="true"></span>' : '') + '</div>';
  }).join('');
  var nowHtml = '';
  if (nm >= startH * 60 && nm <= endH * 60) {
    var ny = (nm - startH * 60) / 60 * HOUR_PX;
    nowHtml = '<div class="now" style="top:' + ny + 'px" aria-hidden="true"></div><div class="nowtag mono" style="top:' + (ny - 9) + 'px">Now ' + pad(Math.floor(nm / 60)) + ':' + pad(nm % 60) + '</div>';
  }
  var unsched = D.open.filter(function (t) { return !t.sched_start; }).map(function (t) {
    return '<button class="btn sm" data-act="slotTask" data-id="' + t.id + '" aria-label="Place ' + esc(t.title) + ' on the timeline">' + esc(t.title.length > 28 ? t.title.slice(0, 27) + '…' : t.title) + '</button>';
  }).join('');
  return '<section class="card"><div class="row between" style="align-items:baseline;flex-wrap:wrap"><h2>Today\'s timeline</h2><span class="muted" style="font-size:13px">Drag a block to move it, pull its bottom edge to resize, tap to edit</span></div>' +
    '<div><button class="btn sm" data-act="exportIcs">Add timed tasks to Google Calendar</button></div>' +
    (unsched ? '<div><div class="muted" style="font-size:13px;margin-bottom:6px">Not on the timeline yet. Tap to place:</div><div class="row" style="flex-wrap:wrap;gap:6px">' + unsched + '</div></div>' : '') +
    '<div class="tl" style="height:' + height + 'px"><div>' + hours + '</div>' + html + nowHtml + '</div></section>';
}

function waitingCard(D) {
  var rows = D.waiting.map(function (t) {
    return '<div class="row" style="gap:8px;font-size:14px"><div style="flex:1;min-width:0"><span style="font-weight:500">' + esc(t.assignee || 'Someone') + '</span> &middot; ' + esc(t.title) + '</div>' +
      '<button class="btn sm" data-act="nudge" data-id="' + t.id + '">Nudge</button>' +
      '<button class="btn sm ok" data-act="received" data-id="' + t.id + '">Received</button></div>';
  }).join('');
  return '<section class="card"><div class="row between"><h2>Waiting on</h2><span class="chip">' + D.waiting.length + ' open</span></div>' +
    (rows || '<div class="muted" style="font-size:14px">Nothing delegated and pending.</div>') + '</section>';
}

/* ---------- modals ---------- */
function planTodayModal(D) {
  var ws = weekStart(0);
  var seen = {};
  function cands(list, label) {
    var rows = list.filter(function (t) { if (seen[t.id]) return false; seen[t.id] = 1; return true; }).map(function (t) {
      var sel = !!S.planSel[t.id];
      return '<button class="pick' + (sel ? ' sel' : '') + '" data-act="planToggle" data-id="' + t.id + '" aria-pressed="' + sel + '">' +
        '<span class="box">' + (sel ? CHECK : '') + '</span><span style="flex:1;min-width:0">' + esc(t.title) +
        (t.due_date ? ' <span class="muted" style="font-size:13px">Due ' + esc(fmtDay(t.due_date)) + '</span>' : '') + '</span>' +
        domChip(t.domain) + blockedChip(t) + (t.budget_min ? '<span class="chip mono">' + fmtMin(t.budget_min) + '</span>' : '') + '</button>';
    }).join('');
    return rows ? '<section class="card flush"><div style="padding:14px 16px"><h2>' + label + '</h2></div>' + rows + '</section>' : '';
  }
  var openNotToday = S.tasks.filter(function (t) { return t.status === 'open' && t.today_date !== D.t0; });
  var picks = openNotToday.filter(function (t) { return t.week_pick_start === ws; });
  var nowT = openNotToday.filter(function (t) { return t.priority === 'now'; });
  var soonT = D.soon.slice(0, 15);
  var body = cands(picks, 'This week\'s Big 3') + cands(nowT, 'Marked Now') + cands(soonT, 'Soon');
  var selIds = Object.keys(S.planSel).filter(function (k) { return S.planSel[k]; });
  var addMin = S.tasks.filter(function (t) { return S.planSel[t.id]; }).reduce(function (n, t) { return n + (t.budget_min || 0); }, 0);
  return '<div class="row between"><h2 style="font-size:20px">Plan today</h2><button class="btn sm" data-act="closeModal">Close</button></div>' +
    '<div class="muted" style="font-size:14px">Already on Today: ' + (D.planned ? fmtMin(D.planned) : 'nothing') + '. Pick what else belongs here.</div>' +
    (body || '<div class="card muted">Nothing open to pull in.</div>') +
    '<div class="row between" style="position:sticky;bottom:0;background:#F3F4F1;padding-top:6px"><span class="muted">' + selIds.length + ' picked' + (addMin ? ' &middot; ' + fmtMin(addMin) : '') + '</span>' +
    '<button class="btn prime" data-act="planApply"' + (selIds.length ? '' : ' disabled') + '>Add to Today</button></div>';
}

function planWeekModal() {
  var ws = weekStart(S.weekOffset);
  var otherWs = weekStart(S.weekOffset === 0 ? 1 : 0), otherLabel = S.weekOffset === 0 ? 'next week' : 'this week';
  var cur = {};
  S.weekTasks.forEach(function (t) { if (t.week_pick_start === ws) cur[t.id] = true; });
  var byDom = {}, otherCount = 0;
  S.tasks.forEach(function (t) {
    if (t.status === 'done' || t.status === 'dropped') return;
    if (t.status === 'waiting' && !cur[t.id]) return;
    if (t.week_pick_start === otherWs && !cur[t.id] && !S.weekSel[t.id]) {
      otherCount++;
      if (!S.weekShowOther) return;
    }
    (byDom[t.domain] = byDom[t.domain] || []).push(t);
  });
  var total = 0, count = 0;
  var cards = S.domains.map(function (d) {
    var list = byDom[d.code] || [];
    var n = list.filter(function (t) { return S.weekSel[t.id]; }).length;
    var rows = list.map(function (t) {
      var sel = !!S.weekSel[t.id];
      if (sel) { total += t.budget_min || 0; count++; }
      var blocked = !sel && n >= 3;
      return '<button class="pick' + (sel ? ' sel' : '') + '" data-act="weekToggle" data-id="' + t.id + '" data-dom="' + esc(d.code) + '" aria-pressed="' + sel + '"' + (blocked ? ' disabled' : '') + '>' +
        '<span class="box">' + (sel ? CHECK : '') + '</span><span style="flex:1;min-width:0">' + esc(t.title) + '</span>' +
        (t.week_pick_start === otherWs ? '<span class="chip amber">Picked for ' + otherLabel + '</span>' : '') +
        (blocked ? '<span class="muted" style="font-size:12px">Full: drop one first</span>' : '') +
        (t.budget_min ? '<span class="chip mono">' + fmtMin(t.budget_min) + '</span>' : '') + '</button>';
    }).join('');
    if (!list.length && !n) {
      return '';
    }
    return '<section class="card flush"><div class="row between" style="padding:14px 16px"><span>' + domChip(d.code) + '</span><span class="muted" style="font-size:14px">' + n + ' of 3 picked</span></div>' + rows +
      '<div style="padding:10px 16px;border-top:1px solid #E6E9E4"><label class="sr" for="wk_' + esc(d.code) + '">Add a task for ' + esc(d.code) + '</label>' +
      '<input id="wk_' + esc(d.code) + '" class="field" data-addweek="' + esc(d.code) + '" placeholder="Add a task to ' + esc(d.code) + ', then press Enter"></div></section>';
  }).join('');
  var seg = '<div class="seg" role="group" aria-label="Which week"><button class="' + (S.weekOffset === 0 ? 'on' : '') + '" data-act="weekSwitch" data-o="0">This week</button>' +
    '<button class="' + (S.weekOffset === 1 ? 'on' : '') + '" data-act="weekSwitch" data-o="1">Next week</button></div>';
  return '<div class="row between"><h2 style="font-size:20px">Plan the week</h2><button class="btn sm" data-act="closeModal">Close</button></div>' +
    '<div class="row between" style="flex-wrap:wrap">' + seg + '<span class="muted" style="font-size:14px">Week of ' + esc(fmtDay(ws)) + '. Up to three per domain.</span></div>' +
    (otherCount ? '<div class="row" style="flex-wrap:wrap;gap:8px"><span class="muted" style="font-size:14px">' + (S.weekShowOther ? 'Showing' : 'Hiding') + ' ' + otherCount + ' task' + (otherCount === 1 ? '' : 's') + ' already picked for ' + otherLabel + '.</span><button class="btn sm" data-act="weekOther">' + (S.weekShowOther ? 'Hide them' : 'Show them to carry over') + '</button></div>' : '') +
    (cards || '<div class="card muted">Add a first task in any domain with Capture, then come back.</div>') +
    '<div class="row between" style="position:sticky;bottom:0;background:#F3F4F1;padding-top:6px"><span class="muted">' + count + ' picks' + (total ? ' &middot; ' + fmtMin(total) : '') + '</span>' +
    '<button class="btn prime" data-act="weekSave">Save week</button></div>';
}

function shutdownModal(D) {
  var undone = D.open;
  var habitsOpen = S.habits.filter(function (h) { return !S.habitDone[h.id]; });
  var list = undone.map(function (t) { return '<li>' + esc(t.title) + '</li>'; }).join('');
  return '<div class="row between"><h2 style="font-size:20px">Evening shutdown</h2><button class="btn sm" data-act="closeModal">Close</button></div>' +
    '<section class="card"><div class="row between"><h2>Inbox</h2>' + (S.inbox.length ? '<span class="chip amber">' + S.inbox.length + ' to confirm</span>' : '<span class="chip green">Clear</span>') + '</div>' +
    (S.newCaptures ? '<div class="muted" style="font-size:14px">' + S.newCaptures + ' saved note' + (S.newCaptures === 1 ? '' : 's') + ' still unsorted. Ask Claude to process your inbox.</div>' : '') + '</section>' +
    '<section class="card"><div class="row between"><h2>Habits</h2>' + (habitsOpen.length ? '<span class="chip amber">' + habitsOpen.length + ' not logged</span>' : '<span class="chip green">All logged</span>') + '</div>' +
    (habitsOpen.length ? '<div class="muted" style="font-size:14px">' + habitsOpen.map(function (h) { return esc(h.id + ' ' + h.label); }).join(', ') + '</div>' : '') + '</section>' +
    '<section class="card"><div class="row between"><h2>Unfinished today</h2><span class="chip">' + undone.length + '</span></div>' +
    (undone.length ? '<ul style="margin:0;padding-left:18px;font-size:14px">' + list + '</ul>' : '<div class="muted" style="font-size:14px">Everything planned for today is done.</div>') +
    '<button class="btn prime" data-act="rollover"' + (undone.length ? '' : ' disabled') + '>Roll unfinished to tomorrow</button></section>';
}

function fmtStamp(iso) { var d = new Date(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ', ' + fmtClock(iso); }
function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
var STATUS_LABEL = { open: 'Open', waiting: 'Waiting', done: 'Done', dropped: 'Dropped' };

function allModal() {
  var st = S.allFilter, q = (S.allQuery || '').toLowerCase().trim(), dm = S.allDomain;
  var c = { scheduled: 0, unscheduled: 0, waiting: 0, done: 0, dropped: 0 };
  S.allTasks.forEach(function (t) {
    if (t.status === 'open') { if (isScheduled(t)) c.scheduled++; else c.unscheduled++; }
    else if (c[t.status] !== undefined) c[t.status]++;
  });
  function cat(t) { return t.status === 'open' ? (isScheduled(t) ? 'scheduled' : 'unscheduled') : t.status; }
  var base = S.allTasks.filter(function (t) {
    return (!dm || t.domain === dm) && (!q || (t.title + ' ' + (t.notes || '') + ' ' + (t.assignee || '')).toLowerCase().indexOf(q) >= 0);
  });
  var labels = { active: 'Active', scheduled: 'Scheduled', unscheduled: 'Unscheduled', waiting: 'Waiting', done: 'Done', dropped: 'Dropped', all: 'All' };
  var counts = { active: c.scheduled + c.unscheduled, scheduled: c.scheduled, unscheduled: c.unscheduled, waiting: c.waiting, done: c.done, dropped: c.dropped, all: S.allTasks.length };
  var chips = ['active', 'scheduled', 'unscheduled', 'waiting', 'done', 'dropped', 'all'].map(function (k) {
    return '<button class="btn sm' + (st === k ? ' on' : '') + '" data-act="allFilter" data-f="' + k + '" aria-pressed="' + (st === k) + '">' + labels[k] + ' ' + counts[k] + '</button>';
  }).join('');
  function rowHtml(t) {
    var sub = [], k = cat(t);
    if (k === 'scheduled') sub.push('Scheduled: ' + esc(schedLabel(t)));
    else if (k === 'unscheduled' && t.today_date) sub.push('Was planned for ' + esc(fmtDay(t.today_date)));
    if (t.due_date) sub.push('Due ' + esc(fmtDay(t.due_date)));
    if (t.status === 'waiting' && t.assignee) sub.push('With ' + esc(t.assignee));
    var chip = k === 'scheduled' ? '<span class="chip" style="background:#E3EEF9;color:#1D5FA8">Scheduled</span>'
      : '<span class="chip' + (k === 'done' ? ' green' : k === 'waiting' ? ' amber' : '') + '">' + (k === 'unscheduled' ? 'Unscheduled' : STATUS_LABEL[k]) + '</span>';
    return '<button class="pick" data-act="editTask" data-id="' + t.id + '"><span style="flex:1;min-width:0"><span' + (k === 'done' || k === 'dropped' ? ' class="muted"' : '') + '>' + esc(t.title) + '</span>' +
      (sub.length ? '<br><span class="muted" style="font-size:13px">' + sub.join(' &middot; ') + '</span>' : '') + '</span>' +
      domChip(t.domain) + goalChip(t) + blockedChip(t) + chip + (t.budget_min ? '<span class="chip mono">' + fmtMin(t.budget_min) + '</span>' : '') + '</button>';
  }
  function byTime(a, b) { var x = (a.today_date || '') + (a.sched_start || '99'), y = (b.today_date || '') + (b.sched_start || '99'); return x < y ? -1 : x > y ? 1 : 0; }
  var body, shown = 0;
  if (st === 'active') {
    var sch = base.filter(function (t) { return cat(t) === 'scheduled'; }).sort(byTime);
    var uns = base.filter(function (t) { return cat(t) === 'unscheduled'; });
    shown = sch.length + uns.length;
    body = '<section class="card flush"><div style="padding:14px 16px"><h2>Scheduled (' + sch.length + ')</h2></div>' + (sch.slice(0, 300).map(rowHtml).join('') || '<div class="empty" style="border-top:1px solid #E6E9E4">Nothing scheduled yet. Open a task and give it a date, or place it on the timeline.</div>') + '</section>' +
      '<section class="card flush"><div style="padding:14px 16px"><h2>Unscheduled (' + uns.length + ')</h2></div>' + (uns.slice(0, 300).map(rowHtml).join('') || '<div class="empty" style="border-top:1px solid #E6E9E4">Nothing waiting to be scheduled.</div>') + '</section>';
  } else {
    var list = base.filter(function (t) { return st === 'all' || cat(t) === st; });
    if (st === 'scheduled') list.sort(byTime);
    shown = list.length;
    body = '<section class="card flush">' + (list.slice(0, 300).map(rowHtml).join('') || '<div class="empty">Nothing matches.</div>') + '</section>';
  }
  var domOpts = '<option value="">All domains</option>' + S.domains.map(function (d) { return opt(d.code, d.code, dm); }).join('');
  return '<div class="row between"><h2 style="font-size:20px">All tasks</h2><button class="btn sm" data-act="closeModal">Close</button></div>' +
    '<div class="row" style="flex-wrap:wrap;gap:8px">' + chips + '</div>' +
    '<div class="row" style="flex-wrap:wrap"><label class="sr" for="allQ">Search tasks</label>' +
    '<input id="allQ" class="field" style="flex:1 1 200px" placeholder="Search title, notes or person" value="' + esc(S.allQuery) + '" autocomplete="off">' +
    '<label class="sr" for="allDomain">Domain</label><select id="allDomain" class="field" style="width:170px" data-change="allDomain">' + domOpts + '</select></div>' +
    body + '<div class="muted" style="font-size:13px">' + shown + ' task' + (shown === 1 ? '' : 's') + '. Tap one to edit. Scheduled means an open task with a date today or later.</div>';
}

function notesModal() {

/* ---------- goals, roadmap, review ---------- */

/* ---------- week view ---------- */
var DAY_CAP = 360;

      (t.sched_start ? '<span class="chip mono">' + hm(t.sched_start) + '</span>' : '') + (t.budget_min ? '<span class="chip mono">' + fmtMin(t.budget_min) + '</span>' : '') +

  }

/* ---------- dependencies ---------- */
function prereqsOf(id) { return S.deps.filter(function (d) { return d.task_id === id; }).map(function (d) { return d.depends_on; }); }

}

}

}

}

}

  return mx && mx > g.due_date ? dayGap(g.due_date, mx) : 0;
}

  var svg = appEl.querySelector ? appEl.querySelector('.rarrows') : null; if (!svg) return;
  var grid = svg.parentNode, gr = grid.getBoundingClientRect(), out = '';
  svg.setAttribute('width', grid.offsetWidth || gr.width || 0);
  svg.setAttribute('height', grid.offsetHeight || gr.height || 0);
  S.deps.forEach(function (d) {

    if (!a || !b) return;
    var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    var x1 = ra.right - gr.left, y1 = ra.top + ra.height / 2 - gr.top, x2 = rb.left - gr.left, y2 = rb.top + rb.height / 2 - gr.top;
    var dx = Math.max(24, Math.abs(x2 - x1) / 2);
    var bad = depClash(taskById(d.depends_on), taskById(d.task_id));
    var col = bad ? '#B42318' : '#55625B';
    out += '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2 + '" fill="none" stroke="' + col + '" stroke-width="' + (bad ? 2 : 1.4) + '"' + (bad ? ' stroke-dasharray="5 3"' : '') + '/>' +
      '<path d="M' + (x2 - 7) + ' ' + (y2 - 4) + ' L' + x2 + ' ' + y2 + ' L' + (x2 - 7) + ' ' + (y2 + 4) + ' Z" fill="' + col + '"/>';

function applyMove(id, upd, delta) {

  var go = cas.length > 0 && window.confirm('Also move the ' + cas.length + ' task' + (cas.length === 1 ? '' : 's') + ' that depend on this one later by ' + delta + ' day' + (delta === 1 ? '' : 's') + '?');
  return act(async function () {
    var r = await sb.from('ck_tasks').update(upd).eq('id', id); if (r.error) return r;

      for (var i = 0; i < cas.length; i++) {
        var c = cas[i], u = {};
        if (c.due_date) u.due_date = ymd(addDays(pd(c.due_date), delta));
        if (c.start_date) u.start_date = ymd(addDays(pd(c.start_date), delta));

function roadHtml() {
  var obj = activeObj(), t0 = todayStr();
  var top = '<div class="row between"><h2 style="font-size:20px">Roadmap</h2><button class="btn sm" data-act="closeModal">Close</button></div>';
  if (!obj) { return top + '<div class="card muted">No objectives yet. Set one up with Claude in a goal-setting session and it will appear here.</div>'; }
  var objs = activeObjs();
  var zoomSeg = '<div class="seg" role="group" aria-label="Zoom">' + [['all', 'Whole journey'], ['y1', '15 months'], ['q', '90 days']].map(function (z) {

  /* lanes */

  var todayPct = rpct(new Date(), R);
  var snap = S.road.zoom === 'all' ? 7 : 1;
  var rows = '';
  rows += '<div class="rrow raxis"><div class="rlab"></div><div class="rlane" style="height:28px">' + tickHtml(R, true) + '</div></div>';
  rows += '<div class="rrow"><div class="rlab"><b>Objective</b><small>' + esc(shortText(obj.title, 60)) + '</small></div><div class="rlane" style="height:48px">' + tickHtml(R, false) +
    '<div class="robj" style="left:' + (obj.start_date ? rpct(pd(obj.start_date), R) : 0) + '%;right:' + (100 - (obj.end_date ? rpct(pd(obj.end_date), R) : 100)) + '%">' + esc(shortText(obj.title, 90)) + '</div>' +
    '<div class="rtoday" style="left:' + todayPct + '%"></div></div></div>';
  lanes.forEach(function (L) {
    var lg = goals.filter(function (g) { return (g.strategy_id && stratById(g.strategy_id) ? g.strategy_id : '') === L.id; }).sort(function (a, b) { return (a.due_date || '9') < (b.due_date || '9') ? -1 : 1; });
    var lt = tasks.filter(function (t) { return t.due_date && laneOfTask(t) === L.id; }).sort(function (a, b) { return a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0; });
    var h = '', gRows = lg.length;

    var row = { objective_id: obj.id, domain: obj.domain, title: title, kind: kind, due_date: F.due || null, strategy_id: F.strategy || null, sort_order: objGoals(obj).length + 1 };
    if (kind === 'number') { row.unit = (F.unit || '').trim() || null; row.start_value = +F.start || 0; row.current_value = +F.start || 0; row.target_value = +F.target; }
    if (kind === 'habit') { row.habit_per_week = +F.hpw || null; }
    act(function () { return sb.from('ck_goals').insert(row); }, 'Goal added.').then(function () { S.road.form = null; render(); });
  } else {
    var g = F.goal ? goalById(F.goal) : null;
    if (F.start && F.due && F.start > F.due) { toast('The start date is after the finish date.'); return; }
    var trow = { title: title, domain: obj.domain, goal_id: g ? g.id : null, strategy_id: g ? (g.strategy_id || null) : (F.strategy || null), due_date: F.due || null, start_date: F.start || null, budget_min: F.budget ? +F.budget : null, status: 'open', priority: 'soon' };
    act(async function () {
      var r = await sb.from('ck_tasks').insert(trow).select('id').single();
      if (r.error) return r;
      if (F.after && r.data && r.data.id) { var dr = await sb.from('ck_task_deps').insert({ task_id: r.data.id, depends_on: F.after }); if (dr.error) return dr; }
      return {};

  }
};
actions.roadSaveGoal = function () {
  var s = S.road.sel, F = S.road.f; if (!s || s.t !== 'g') return;
  var g = goalById(s.id); if (!g) return;
  var title = (F.title || '').trim(); if (!title) { toast('A goal needs a name.'); return; }
  var upd = { title: title, due_date: F.due || null, updated_at: new Date().toISOString() };
  if (g.kind === 'number') { if (F.target === '' || isNaN(+F.target)) { toast('Enter the target number.'); return; } upd.target_value = +F.target; }
  act(function () { return sb.from('ck_goals').update(upd).eq('id', g.id); }, 'Goal saved.').then(function () { roadSetSel('g', g.id); render(); });
};
actions.roadCheckin = function () {
  var s = S.road.sel, F = S.road.f; if (!s || s.t !== 'g') return;
  var g = goalById(s.id); if (!g) return;
  var val = null;
  if (g.kind === 'number') { if (F.value === '' || isNaN(+F.value)) { toast('Enter where it stands now.'); return; } val = +F.value; }
  act(async function () {
    var a = await sb.from('ck_goal_checkins').insert({ goal_id: g.id, value: val, health: F.health || 'on_track', note: (F.note || '').trim() || null });
    if (a.error) return a;
    var upd = { updated_at: new Date().toISOString() };
    if (val !== null) upd.current_value = val;
    return sb.from('ck_goals').update(upd).eq('id', g.id);
  }, 'Check-in saved.').then(function () { roadSetSel('g', g.id); render(); });
};
actions.roadGoalStatus = function (el) {
  var s = S.road.sel; if (!s || s.t !== 'g') return;
  var g = goalById(s.id); if (!g) return;
  var st = el.dataset.s;
  if (st === 'dropped' && !window.confirm('Drop this goal? Its tasks stay, but the goal leaves the roadmap.')) return;
  var upd = { status: st, closed_at: st === 'active' ? null : new Date().toISOString(), updated_at: new Date().toISOString() };
  act(function () { return sb.from('ck_goals').update(upd).eq('id', g.id); }, st === 'done' ? 'Goal marked done.' : st === 'dropped' ? 'Goal dropped.' : 'Goal reopened.').then(function () { if (st === 'dropped') { S.road.sel = null; } render(); });
};
actions.roadSaveTask = function (el) {
  var F = S.road.f, id = el.dataset.id;
  var title = (F.title || '').trim(); if (!title) { toast('A task needs a name.'); return; }
  if (F.start && F.due && F.start > F.due) { toast('The start date is after the finish date.'); return; }
  var g = F.goal ? goalById(F.goal) : null;
  var cur = taskById(id);
  var upd = { title: title, due_date: F.due || null, start_date: F.start || null, goal_id: g ? g.id : null };
  if (!cur || (cur.goal_id || '') !== (F.goal || '')) { upd.strategy_id = g ? (g.strategy_id || null) : null; }
  var delta = cur && cur.due_date && F.due ? dayGap(cur.due_date, F.due) : 0;
  applyMove(id, upd, delta).then(function () { roadSetSel('t', id); render(); });

actions.roadDepDel = function (el) {
  act(function () { return sb.from('ck_task_deps').delete().eq('task_id', el.dataset.t).eq('depends_on', el.dataset.p); }, 'Prerequisite removed.');

actions.roadTaskDone = function (el) {

  act(function () { return sb.from('ck_tasks').update(isDone ? { status: 'open', done_at: null } : { status: 'done', done_at: new Date().toISOString() }).eq('id', t.id); }, isDone ? 'Reopened.' : 'Marked done.');

actions.revWeek = function (el) {
  S.rev.off = Math.min(0, S.rev.off + (+el.dataset.d));
  render();
  loadExtra().then(render).catch(function (e) { toast('Could not load: ' + e.message); });

/* sideways drag on roadmap diamonds and dots */
var rdrag = null, rtip = null;
appEl.addEventListener('pointerdown', function (e) {
  var h = e.target.closest ? e.target.closest('.rdrag') : null;
  if (!h || (e.button !== undefined && e.button > 0)) return;
  var lane = h.closest('.rlane'); if (!lane) return;
  var host = h.classList.contains('rh') ? h.parentNode : h;
  rdrag = { el: h, host: host, kind: h.dataset.kind, id: host.dataset.id, d0: host.dataset.d || '', s0: host.dataset.s || '', x0: e.clientX,
    w: lane.getBoundingClientRect().width || 1, days: +lane.dataset.days || 1, snap: +lane.dataset.snap || 1,
    left0: parseFloat(host.style.left), wid0: parseFloat(host.style.width) || 0, moved: false, nd: host.dataset.d || '', ns: host.dataset.s || '' };
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
appEl.addEventListener('pointermove', function (e) {
  if (!rdrag) return;
  var dx = e.clientX - rdrag.x0;
  if (!rdrag.moved && Math.abs(dx) < 5) return;
  rdrag.moved = true;
  var r = rdrag, k = r.kind, dd = Math.round(dx / r.w * r.days / r.snap) * r.snap;
  if (k === 'te' && r.s0) { dd = Math.max(dd, -dayGap(r.s0, r.d0)); }
  if (k === 'ts' && r.s0) { dd = Math.min(dd, dayGap(r.s0, r.d0)); }
  var pc = dd / r.days * 100;
  if (k === 'g' || k === 't') { r.nd = ymd(addDays(pd(r.d0), dd)); r.host.style.left = Math.max(0, Math.min(100, r.left0 + pc)) + '%'; }
  else if (k === 'tb') { r.nd = ymd(addDays(pd(r.d0), dd)); r.ns = ymd(addDays(pd(r.s0), dd)); r.host.style.left = Math.max(0, r.left0 + pc) + '%'; }
  else if (k === 'te') { r.nd = ymd(addDays(pd(r.d0), dd)); r.host.style.width = Math.max(0.4, r.wid0 + pc) + '%'; }
  else if (k === 'ts') { r.ns = ymd(addDays(pd(r.s0), dd)); r.host.style.left = Math.max(0, r.left0 + pc) + '%'; r.host.style.width = Math.max(0.4, r.wid0 - pc) + '%'; }
  if (!rtip) { rtip = document.createElement('div'); rtip.className = 'rtip'; document.body.appendChild(rtip); }
  rtip.textContent = (k === 'tb' || k === 'ts' ? fmtDay(r.ns) + (k === 'tb' ? ' to ' + fmtDay(r.nd) : '') : fmtDay(r.nd)) + ' ' + String(k === 'ts' ? r.ns : r.nd).slice(0, 4);
  rtip.style.left = (e.clientX + 12) + 'px'; rtip.style.top = (e.clientY - 34) + 'px';
  drawDeps();
});
function endRdrag(e) {
  if (!rdrag) return;
  var d = rdrag; rdrag = null;
  if (rtip) { rtip.remove(); rtip = null; }
  try { d.el.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!d.moved) { roadSetSel(d.kind === 'g' ? 'g' : 't', d.id); render(); return; }
  if (d.kind === 'g') {
    if (d.nd === d.d0) { render(); return; }
    act(function () { return sb.from('ck_goals').update({ due_date: d.nd, updated_at: new Date().toISOString() }).eq('id', d.id); }, 'Goal now due ' + fmtDay(d.nd) + '.');
    return;
  }
  var upd = {}, delta = 0;
  if (d.kind === 'ts') { if (d.ns === d.s0) { render(); return; } upd.start_date = d.ns; }
  else if (d.kind === 'tb') { if (d.nd === d.d0) { render(); return; } upd.start_date = d.ns; upd.due_date = d.nd; delta = dayGap(d.d0, d.nd); }
  else { if (d.nd === d.d0) { render(); return; } upd.due_date = d.nd; delta = dayGap(d.d0, d.nd); }
  applyMove(d.id, upd, delta);
}
appEl.addEventListener('pointerup', endRdrag);
appEl.addEventListener('pointercancel', function () { if (rdrag) { rdrag = null; if (rtip) { rtip.remove(); rtip = null; } render(); } });

actions.wkNav = function (el) {
  var d = +el.dataset.d;
  S.wkOff = d === 0 ? 0 : S.wkOff + d;
  render();
  loadExtra().then(render).catch(function (e) { toast('Could not load: ' + e.message); });
};
appEl.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});
appEl.addEventListener('change', function (e) {
  var el = e.target;
  var what = el.dataset && el.dataset.change;
  if (!what) return;
  if (what === 'ef') {
    if (S.edit) {
      S.edit.f[el.id.slice(3)] = el.type === 'checkbox' ? el.checked : el.value;
      if (el.id === 'ef_status') render();
    }
  }
  else if (what === 'rf') { S.road.f[el.id.slice(3)] = el.value; if (el.id === 'rf_kind') render(); }
  else if (what === 'wkMove') {
    var v = el.value, mid = el.dataset.id;
    if (v) {
      var upd2 = v === 'none' ? { today_date: null, sched_start: null } : { today_date: v };
      act(function () { return sb.from('ck_tasks').update(upd2).eq('id', mid); }, v === 'none' ? 'Taken off this week.' : 'Moved.');
    }
  }
  else if (what === 'rfdep') {
    var pid = el.value, sel = S.road.sel;
    if (pid && sel && sel.t === 't') { act(function () { return sb.from('ck_task_deps').insert({ task_id: sel.id, depends_on: pid }); }, 'Prerequisite added.'); }
  }
  else if (what === 'roadObj') { S.road.obj = el.value; S.road.sel = null; S.road.form = null; render(); }
  else if (what === 'allDomain') { S.allDomain = el.value; render(); }
  else if (what === 'qDomain') { S.qDomain = el.value; }
  else if (what === 'qBudget') { S.qBudget = +el.value; }
  else if (what === 'setTime') {
    var v = el.value || null;
    act(function () { return sb.from('ck_tasks').update({ sched_start: v }).eq('id', el.dataset.id); });
  }
});
appEl.addEventListener('input', function (e) {
  var id = e.target.id || '';
  if (id === 'capNote') { S.draft = e.target.value; }
  else if (id === 'qTitle') { S.qTitle = e.target.value; }
  else if (id === 'allQ') { S.allQuery = e.target.value; render(); }
  else if (id.indexOf('rf_') === 0) { S.road.f[id.slice(3)] = e.target.value; }
  else if (id.indexOf('ef_') === 0 && S.edit && e.target.type !== 'checkbox') { S.edit.f[id.slice(3)] = e.target.value; }
});
appEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'qTitle') { e.preventDefault(); actions.addTask(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.addday) {
    e.preventDefault();
    var wtitle = e.target.value.trim(), wday = e.target.dataset.addday;
    if (!wtitle) return;
    act(function () { return sb.from('ck_tasks').insert({ title: wtitle, domain: S.qDomain, budget_min: S.qBudget, status: 'open', priority: 'now', today_date: wday }); }, 'Added.');
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.addweek) {
    e.preventDefault();
    var title = e.target.value.trim(); var dom = e.target.dataset.addweek;
    if (!title) return;
    var ws = weekStart(S.weekOffset);
    var count = 0;
    S.tasks.forEach(function (t) { if (t.domain === dom && S.weekSel[t.id]) count++; });
    (async function () {
      S.busy = true;
      try {
        var r = await sb.from('ck_tasks').insert({ title: title, domain: dom, priority: 'soon' }).select('id').single();
        if (r.error) throw new Error(r.error.message);
        var newId = r.data.id;
        await loadAll();
        if (count < 3) { S.weekSel[newId] = true; }
        toast('Added.');
      } catch (err) { toast('That did not work: ' + (err.message || err)); }
      S.busy = false; render();
    })();
  }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('blk') && e.target.dataset.id) { actions.editTask({ dataset: { id: e.target.dataset.id } }); }
  if (e.key === 'Escape') { if (S.edit) { S.edit = null; render(); } else if (S.modal) { S.modal = null; render(); } }
});
appEl.addEventListener('submit', async function (e) {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  var email = document.getElementById('lemail').value.trim();
  var pass = document.getElementById('lpass').value;
  S.busy = true; S.loginError = ''; render();
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) throw new Error(r.error.message);
    await startSession(r.data.user);
  } catch (err) { S.loginError = err.message || String(err); S.busy = false; render(); }
});

async function startSession(user) {
  var chk = await sb.rpc('ck_is_owner');
  if (chk.error || chk.data !== true) {
    await sb.auth.signOut();
    S.user = null; S.busy = false;
    S.loginError = 'This account does not have access to Cockpit.';
    render();
    return;
  }
  S.user = user; S.busy = false;
  await refresh();
}

document.addEventListener('visibilitychange', function () { if (!document.hidden && S.user) { refresh(); } });
setInterval(function () {
  if (!S.user || S.modal || S.edit || S.busy) return;
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) { return; }
  refresh();
}, 60000);

(async function init() {
  try {
    var r = await sb.auth.getSession();
    S.ready = true;
    if (r.data && r.data.session) { await startSession(r.data.session.user); }
    else { render(); }
  } catch (e) { S.ready = true; render(); }
})();
render();
})();
</script>
